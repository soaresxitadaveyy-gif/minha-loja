<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabor Delivery - Cardápio Online & Painel de Gestão</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff1f2',
              100: '#ffe4e6',
              500: '#ea580c', // Laranja iFood vibrante
              600: '#d97706',
              700: '#c2410c',
              dark: '#0f172a'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            title: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      -webkit-tap-highlight-color: transparent;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .animate-pulse-ring {
      animation: pulse-ring 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20">

  <div id="root"></div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, signOut, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.FirebaseSDK = {
      initializeApp, getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, signOut, signInWithEmailAndPassword,
      getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, deleteDoc, addDoc
    };
  </script>

  <!-- React Application Code -->
  <script type="text/babel">

    const DEFAULT_STORE_CONFIG = {
      name: "Sabor & Cia Delivery",
      whatsapp: "5511999999999",
      address: "Rua das Flores, 123 - Centro",
      deliveryFee: 5.00,
      isOpen: true,
      bannerUrl: "https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1000&q=80"
    };

    const INITIAL_CATEGORIES = ["Hambúrgueres", "Pizzas", "Bebidas", "Sobremesas", "Combos"];

    const DEFAULT_PRODUCTS = [
      {
        id: "prod-1",
        name: "Burger Smash Especial",
        description: "Dois pães selados na manteiga, 2x smash burger 90g, queijo cheddar fatiado e molho especial da casa.",
        price: 28.90,
        category: "Hambúrgueres",
        image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80",
        active: true
      },
      {
        id: "prod-2",
        name: "Pizza Calabresa Crocante",
        description: "Massa artesanal, molho de tomate fresco, queijo muçarela, calabresa fatiada e cebola roxa.",
        price: 49.90,
        category: "Pizzas",
        image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=500&q=80",
        active: true
      },
      {
        id: "prod-3",
        name: "Coca-Cola Zero 350ml",
        description: "Lata trincando de gelada 350ml.",
        price: 6.50,
        category: "Bebidas",
        image: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=500&q=80",
        active: true
      },
      {
        id: "prod-4",
        name: "Brownie Supremo com Sorvete",
        description: "Brownie artesanal com nozes servido com uma bola de sorvete de baunilha e calda de chocolate.",
        price: 18.00,
        category: "Sobremesas",
        image: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=500&q=80",
        active: true
      }
    ];

    function App() {
      const [store, setStore] = React.useState(() => {
        const saved = localStorage.getItem('deliv_store');
        return saved ? JSON.parse(saved) : DEFAULT_STORE_CONFIG;
      });

      const [products, setProducts] = React.useState(() => {
        const saved = localStorage.getItem('deliv_products');
        return saved ? JSON.parse(saved) : DEFAULT_PRODUCTS;
      });

      const [categories, setCategories] = React.useState(() => {
        const saved = localStorage.getItem('deliv_categories');
        return saved ? JSON.parse(saved) : INITIAL_CATEGORIES;
      });

      const [orders, setOrders] = React.useState(() => {
        const saved = localStorage.getItem('deliv_orders');
        return saved ? JSON.parse(saved) : [];
      });

      const [activeCategory, setActiveCategory] = React.useState("Todas");
      const [cart, setCart] = React.useState([]);
      const [isCartOpen, setIsCartOpen] = React.useState(false);
      const [selectedProduct, setSelectedProduct] = React.useState(null);
      
      // Modais e Visões
      const [isAdminView, setIsAdminView] = React.useState(false);
      const [isAdminLoggedIn, setIsAdminLoggedIn] = React.useState(false);
      const [adminTab, setAdminTab] = React.useState('products'); // products, orders, settings

      // Toast Notifications
      const [toast, setToast] = React.useState(null);

      // Persistência local fallback
      React.useEffect(() => {
        localStorage.setItem('deliv_store', JSON.stringify(store));
      }, [store]);

      React.useEffect(() => {
        localStorage.setItem('deliv_products', JSON.stringify(products));
      }, [products]);

      React.useEffect(() => {
        localStorage.setItem('deliv_orders', JSON.stringify(orders));
      }, [orders]);

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      // Carrinho Helpers
      const addToCart = (product, quantity = 1, observation = "") => {
        if (!store.isOpen) {
          showToast("A loja está fechada no momento!", "error");
          return;
        }
        setCart(prev => {
          const existingIndex = prev.findIndex(item => item.id === product.id && item.observation === observation);
          if (existingIndex > -1) {
            const copy = [...prev];
            copy[existingIndex].quantity += quantity;
            return copy;
          }
          return [...prev, { ...product, quantity, observation }];
        });
        showToast(`${product.name} adicionado ao carrinho!`);
      };

      const updateCartQuantity = (index, delta) => {
        setCart(prev => {
          const copy = [...prev];
          copy[index].quantity += delta;
          if (copy[index].quantity <= 0) {
            copy.splice(index, 1);
          }
          return copy;
        });
      };

      const clearCart = () => setCart([]);

      const subtotal = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
      const total = subtotal + (cart.length > 0 ? store.deliveryFee : 0);

      // Filtro de produtos
      const filteredProducts = activeCategory === "Todas"
        ? products.filter(p => p.active)
        : products.filter(p => p.active && p.category === activeCategory);

      return (
        <div className="max-w-md md:max-w-4xl mx-auto bg-white min-h-screen shadow-xl relative pb-24">
          
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full shadow-lg text-white font-medium text-sm flex items-center space-x-2 transition-all ${toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}>
              <i className={toast.type === 'error' ? "fas fa-exclamation-circle" : "fas fa-check-circle"}></i>
              <span>{toast.msg}</span>
            </div>
          )}

          {}
          <header className="relative bg-slate-900 text-white pb-6 rounded-b-3xl shadow-md overflow-hidden">
            <div className="h-32 w-full bg-cover bg-center opacity-40" style={{ backgroundImage: `url(${store.bannerUrl})` }}></div>
            
            <div className="absolute top-4 right-4 z-10">
              <button 
                onClick={() => setIsAdminView(!isAdminView)}
                className="bg-white/20 hover:bg-white/30 backdrop-blur-md text-white text-xs px-3 py-1.5 rounded-full font-medium transition flex items-center space-x-1 border border-white/20"
              >
                <i className="fas fa-lock text-xs"></i>
                <span>{isAdminView ? "Ir para Cardápio" : "Área Restrita"}</span>
              </button>
            </div>

            <div className="px-6 -mt-10 relative z-10 flex items-end justify-between">
              <div className="flex items-center space-x-4">
                <div className="w-20 h-20 bg-orange-600 rounded-2xl flex items-center justify-center text-white text-3xl font-extrabold shadow-lg border-4 border-slate-900 font-title">
                  {store.name.substring(0, 1)}
                </div>
                <div>
                  <h1 className="text-2xl font-bold font-title leading-tight">{store.name}</h1>
                  <p className="text-slate-300 text-xs flex items-center mt-1">
                    <i className="fas fa-map-marker-alt text-orange-500 mr-1"></i>
                    {store.address}
                  </p>
                </div>
              </div>
            </div>

            <div className="px-6 mt-4 flex items-center justify-between text-xs text-slate-300">
              <div className="flex items-center space-x-2">
                <span className={`inline-block w-3 h-3 rounded-full ${store.isOpen ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'}`}></span>
                <span className="font-semibold">{store.isOpen ? "Aberto Agora" : "Fechado"}</span>
              </div>
              <div>
                <i className="fas fa-motorcycle text-orange-400 mr-1"></i>
                Entrega: R$ {store.deliveryFee.toFixed(2)}
              </div>
            </div>
          </header>

          {/* MODO ADMINISTRATIVO OU LOJA */}
          {isAdminView ? (
            <AdminPanel 
              store={store} 
              setStore={setStore} 
              products={products} 
              setProducts={setProducts} 
              categories={categories}
              setCategories={setCategories}
              orders={orders}
              setOrders={setOrders}
              isLoggedIn={isAdminLoggedIn}
              setIsLoggedIn={setIsAdminLoggedIn}
              showToast={showToast}
              activeTab={adminTab}
              setActiveTab={setAdminTab}
            />
          ) : (
            <main className="p-4 md:p-6">
              
              {/* CATEGORIAS */}
              <div className="mb-6">
                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Categorias</h2>
                <div className="flex space-x-2 overflow-x-auto hide-scrollbar pb-2">
                  <button
                    onClick={() => setActiveCategory("Todas")}
                    className={`px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all ${
                      activeCategory === "Todas"
                        ? 'bg-orange-600 text-white shadow-md shadow-orange-500/20'
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`}
                  >
                    Todas
                  </button>
                  {categories.map((cat) => (
                    <button
                      key={cat}
                      onClick={() => setActiveCategory(cat)}
                      className={`px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all ${
                        activeCategory === cat
                          ? 'bg-orange-600 text-white shadow-md shadow-orange-500/20'
                          : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>
              </div>

              {/* LISTA DE PRODUTOS */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {filteredProducts.map(product => (
                  <div 
                    key={product.id}
                    onClick={() => setSelectedProduct(product)}
                    className="bg-white border border-slate-100 rounded-2xl p-3 flex space-x-3 shadow-sm hover:shadow-md transition cursor-pointer group"
                  >
                    <img 
                      src={product.image || "https://placehold.co/200x200/ea580c/ffffff?text=Lanche"} 
                      alt={product.name}
                      className="w-24 h-24 rounded-xl object-cover flex-shrink-0 group-hover:scale-105 transition"
                    />
                    <div className="flex-1 flex flex-col justify-between py-1">
                      <div>
                        <h3 className="font-bold text-slate-800 text-sm line-clamp-1">{product.name}</h3>
                        <p className="text-xs text-slate-500 mt-1 line-clamp-2 leading-relaxed">{product.description}</p>
                      </div>
                      <div className="flex items-center justify-between mt-2">
                        <span className="font-bold text-orange-600 text-base">R$ {product.price.toFixed(2)}</span>
                        <button className="w-8 h-8 rounded-lg bg-orange-50 text-orange-600 flex items-center justify-center text-sm font-bold group-hover:bg-orange-600 group-hover:text-white transition">
                          <i className="fas fa-plus"></i>
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
                {filteredProducts.length === 0 && (
                  <div className="col-span-full py-12 text-center text-slate-400">
                    <i className="fas fa-utensils text-4xl mb-3 text-slate-300"></i>
                    <p className="text-sm font-medium">Nenhum produto cadastrado nesta categoria.</p>
                  </div>
                )}
              </div>

            </main>
          )}

          {/* BARRA DO CARRINHO FLUTUANTE */}
          {!isAdminView && cart.length > 0 && (
            <div className="fixed bottom-4 left-0 right-0 max-w-md md:max-w-4xl mx-auto px-4 z-30">
              <button
                onClick={() => setIsCartOpen(true)}
                className="w-full bg-orange-600 hover:bg-orange-700 text-white p-4 rounded-2xl shadow-xl flex items-center justify-between transition transform active:scale-98"
              >
                <div className="flex items-center space-x-3">
                  <span className="bg-white/20 text-xs px-2.5 py-1 rounded-full font-bold">
                    {cart.reduce((a, b) => a + b.quantity, 0)}
                  </span>
                  <span className="font-bold text-sm">Ver Carrinho</span>
                </div>
                <span className="font-extrabold text-base">R$ {total.toFixed(2)}</span>
              </button>
            </div>
          )}

          {/* MODAL DETALHES DO PRODUTO */}
          {selectedProduct && (
            <ProductDetailModal 
              product={selectedProduct} 
              onClose={() => setSelectedProduct(null)} 
              onAddToCart={addToCart}
            />
          )}

          {/* DRAWER DO CARRINHO & CHECKOUT */}
          {isCartOpen && (
            <CartDrawer 
              cart={cart}
              updateQuantity={updateCartQuantity}
              onClose={() => setIsCartOpen(false)}
              store={store}
              total={total}
              subtotal={subtotal}
              clearCart={clearCart}
              showToast={showToast}
              setOrders={setOrders}
            />
          )}

        </div>
      );
    }

    /* MODAL DE DETALHES DO PRODUTO */
    function ProductDetailModal({ product, onClose, onAddToCart }) {
      const [quantity, setQuantity] = React.useState(1);
      const [obs, setObs] = React.useState('');

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4">
          <div className="bg-white w-full max-w-md rounded-t-3xl md:rounded-3xl overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-200">
            <div className="relative h-48 bg-slate-100">
              <img src={product.image} alt={product.name} className="w-full h-full object-cover" />
              <button 
                onClick={onClose}
                className="absolute top-3 right-3 bg-white/80 backdrop-blur-md w-8 h-8 rounded-full flex items-center justify-center text-slate-700 shadow"
              >
                <i className="fas fa-times"></i>
              </button>
            </div>
            
            <div className="p-5">
              <span className="text-xs font-bold text-orange-600 uppercase tracking-wider">{product.category}</span>
              <h3 className="text-xl font-bold text-slate-800 mt-1">{product.name}</h3>
              <p className="text-sm text-slate-500 mt-2 leading-relaxed">{product.description}</p>

              <div className="mt-4">
                <label className="block text-xs font-bold text-slate-700 mb-1">Observações do Item</label>
                <textarea
                  value={obs}
                  onChange={e => setObs(e.target.value)}
                  placeholder="Ex: Sem cebola, molho à parte..."
                  className="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-orange-500"
                  rows="2"
                ></textarea>
              </div>

              <div className="mt-6 flex items-center justify-between border-t border-slate-100 pt-4">
                <div className="flex items-center space-x-3 bg-slate-100 p-1.5 rounded-xl">
                  <button 
                    onClick={() => setQuantity(Math.max(1, quantity - 1))}
                    className="w-8 h-8 bg-white rounded-lg font-bold text-slate-700 shadow-sm flex items-center justify-center"
                  >
                    -
                  </button>
                  <span className="font-bold text-slate-800 px-2">{quantity}</span>
                  <button 
                    onClick={() => setQuantity(quantity + 1)}
                    className="w-8 h-8 bg-white rounded-lg font-bold text-slate-700 shadow-sm flex items-center justify-center"
                  >
                    +
                  </button>
                </div>

                <button
                  onClick={() => {
                    onAddToCart(product, quantity, obs);
                    onClose();
                  }}
                  className="flex-1 ml-4 bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm flex items-center justify-between px-4"
                >
                  <span>Adicionar</span>
                  <span>R$ {(product.price * quantity).toFixed(2)}</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* CARRINHO & FINALIZAÇÃO DO PEDIDO */
    function CartDrawer({ cart, updateQuantity, onClose, store, total, subtotal, clearCart, showToast, setOrders }) {
      const [name, setName] = React.useState('');
      const [phone, setPhone] = React.useState('');
      const [street, setStreet] = React.useState('');
      const [number, setNumber] = React.useState('');
      const [neighborhood, setNeighborhood] = React.useState('');
      const [paymentMethod, setPaymentMethod] = React.useState('PIX');
      const [changeFor, setChangeFor] = React.useState('');

      const handleCheckout = (e) => {
        e.preventDefault();
        if (!name || !phone || !street || !number || !neighborhood) {
          showToast("Preencha todos os campos obrigatórios de entrega!", "error");
          return;
        }

        const newOrder = {
          id: `#${Math.floor(1000 + Math.random() * 9000)}`,
          customerName: name,
          phone,
          address: `${street}, Nº ${number} - ${neighborhood}`,
          paymentMethod,
          changeFor: paymentMethod === 'Dinheiro' ? changeFor : null,
          items: cart,
          subtotal,
          deliveryFee: store.deliveryFee,
          total,
          status: 'Pendente',
          createdAt: new Date().toISOString()
        };

        // Salvar pedido localmente
        setOrders(prev => [newOrder, ...prev]);

        // Formatar texto para o WhatsApp
        let text = `*NOVO PEDIDO - ${store.name}*\n`;
        text += `*Pedido:* ${newOrder.id}\n`;
        text += `*Cliente:* ${name}\n`;
        text += `*Telefone:* ${phone}\n`;
        text += `*Endereço:* ${newOrder.address}\n\n`;
        text += `*ITENS DO PEDIDO:*\n`;
        
        cart.forEach(item => {
          text += `• ${item.quantity}x ${item.name} - R$ ${(item.price * item.quantity).toFixed(2)}\n`;
          if (item.observation) {
            text += `  _Obs: ${item.observation}_\n`;
          }
        });

        text += `\n*Subtotal:* R$ ${subtotal.toFixed(2)}\n`;
        text += `*Taxa de Entrega:* R$ ${store.deliveryFee.toFixed(2)}\n`;
        text += `*TOTAL:* R$ ${total.toFixed(2)}\n\n`;
        text += `*Forma de Pagamento:* ${paymentMethod}\n`;
        if (paymentMethod === 'Dinheiro' && changeFor) {
          text += `*Troco Para:* R$ ${changeFor}\n`;
        }

        const encoded = encodeURIComponent(text);
        const whatsappUrl = `https://wa.me/${store.whatsapp.replace(/\D/g, '')}?text=${encoded}`;

        clearCart();
        showToast("Pedido gerado! Redirecionando para WhatsApp...");
        setTimeout(() => {
          window.open(whatsappUrl, '_blank');
          onClose();
        }, 1000);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex justify-end">
          <div className="bg-white w-full max-w-md h-full flex flex-col shadow-2xl animate-in slide-in-from-right duration-200">
            
            {/* Topbar */}
            <div className="p-4 bg-slate-900 text-white flex items-center justify-between">
              <h2 className="font-bold text-lg font-title flex items-center">
                <i className="fas fa-shopping-bag text-orange-500 mr-2"></i> Seu Carrinho
              </h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white p-2">
                <i className="fas fa-times text-lg"></i>
              </button>
            </div>

            {/* Listagem e Formulário */}
            <div className="flex-1 overflow-y-auto p-4 space-y-6">
              
              {/* Lista de Itens */}
              <div>
                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Itens Selecionados</h3>
                <div className="space-y-3">
                  {cart.map((item, idx) => (
                    <div key={idx} className="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-100">
                      <div className="flex-1">
                        <h4 className="font-bold text-sm text-slate-800">{item.name}</h4>
                        <p className="text-xs text-orange-600 font-semibold mt-0.5">R$ {(item.price * item.quantity).toFixed(2)}</p>
                        {item.observation && (
                          <p className="text-xs text-slate-400 italic mt-1">Obs: {item.observation}</p>
                        )}
                      </div>
                      <div className="flex items-center space-x-2 bg-white px-2 py-1 rounded-lg border border-slate-200">
                        <button onClick={() => updateQuantity(idx, -1)} className="text-slate-600 px-1.5 font-bold">-</button>
                        <span className="text-xs font-bold w-4 text-center">{item.quantity}</span>
                        <button onClick={() => updateQuantity(idx, 1)} className="text-slate-600 px-1.5 font-bold">+</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Dados do Cliente */}
              <form id="checkout-form" onSubmit={handleCheckout} className="space-y-3 pt-2 border-t border-slate-100">
                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider">Dados de Entrega</h3>
                
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Seu Nome</label>
                  <input
                    type="text"
                    required
                    value={name}
                    onChange={e => setName(e.target.value)}
                    placeholder="Ex: Maria Silva"
                    className="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Telefone / WhatsApp</label>
                  <input
                    type="tel"
                    required
                    value={phone}
                    onChange={e => setPhone(e.target.value)}
                    placeholder="(11) 99999-9999"
                    className="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none"
                  />
                </div>

                <div className="grid grid-cols-3 gap-2">
                  <div className="col-span-2">
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Rua / Av.</label>
                    <input
                      type="text"
                      required
                      value={street}
                      onChange={e => setStreet(e.target.value)}
                      placeholder="Nome da rua"
                      className="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Número</label>
                    <input
                      type="text"
                      required
                      value={number}
                      onChange={e => setNumber(e.target.value)}
                      placeholder="123"
                      className="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Bairro</label>
                  <input
                    type="text"
                    required
                    value={neighborhood}
                    onChange={e => setNeighborhood(e.target.value)}
                    placeholder="Bairro"
                    className="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Forma de Pagamento</label>
                  <select
                    value={paymentMethod}
                    onChange={e => setPaymentMethod(e.target.value)}
                    className="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none"
                  >
                    <option value="PIX">PIX</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                    <option value="Dinheiro">Dinheiro</option>
                  </select>
                </div>

                {paymentMethod === 'Dinheiro' && (
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Troco para Quanto?</label>
                    <input
                      type="text"
                      value={changeFor}
                      onChange={e => setChangeFor(e.target.value)}
                      placeholder="Ex: R$ 50,00"
                      className="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none"
                    />
                  </div>
                )}
              </form>

            </div>

            {/* Subtotal e Envio */}
            <div className="p-4 border-t border-slate-100 bg-slate-50 space-y-3">
              <div className="space-y-1 text-xs text-slate-600">
                <div className="flex justify-between">
                  <span>Subtotal</span>
                  <span>R$ {subtotal.toFixed(2)}</span>
                </div>
                <div className="flex justify-between">
                  <span>Taxa de Entrega</span>
                  <span>R$ {store.deliveryFee.toFixed(2)}</span>
                </div>
                <div className="flex justify-between font-bold text-slate-900 text-sm pt-1 border-t border-slate-200">
                  <span>Total</span>
                  <span className="text-orange-600">R$ {total.toFixed(2)}</span>
                </div>
              </div>

              <button
                type="submit"
                form="checkout-form"
                className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-sm"
              >
                <i className="fab fa-whatsapp text-lg"></i>
                <span>Enviar Pedido via WhatsApp</span>
              </button>
            </div>

          </div>
        </div>
      );
    }

    /* PAINEL ADMINISTRATIVO COMPLETO */
    function AdminPanel({ store, setStore, products, setProducts, categories, setCategories, orders, setOrders, isLoggedIn, setIsLoggedIn, showToast, activeTab, setActiveTab }) {
      const [loginEmail, setLoginEmail] = React.useState('admin@loja.com');
      const [loginPassword, setLoginPassword] = React.useState('123456');

      // Estado do formulário de produto
      const [editingProduct, setEditingProduct] = React.useState(null);
      const [prodName, setProdName] = React.value = React.useState('');
      const [prodDesc, setProdDesc] = React.useState('');
      const [prodPrice, setProdPrice] = React.useState('');
      const [prodCategory, setProdCategory] = React.useState(categories[0] || 'Hambúrgueres');
      const [prodImage, setProdImage] = React.useState('');
      const [newCategoryInput, setNewCategoryInput] = React.useState('');

      const handleLogin = (e) => {
        e.preventDefault();
        // Login simples em memória/fallback
        if (loginEmail === 'admin@loja.com' && loginPassword === '123456') {
          setIsLoggedIn(true);
          showToast("Acesso administrativo liberado!");
        } else {
          showToast("Email ou senha incorretos!", "error");
        }
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setProdImage(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        if (!prodName || !prodPrice) {
          showToast("Preencha Nome e Preço!", "error");
          return;
        }

        const productData = {
          id: editingProduct ? editingProduct.id : `prod-${Date.now()}`,
          name: prodName,
          description: prodDesc,
          price: parseFloat(prodPrice),
          category: prodCategory,
          image: prodImage || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=500&q=80",
          active: editingProduct ? editingProduct.active : true
        };

        if (editingProduct) {
          setProducts(prev => prev.map(p => p.id === editingProduct.id ? productData : p));
          showToast("Produto atualizado com sucesso!");
        } else {
          setProducts(prev => [productData, ...prev]);
          showToast("Produto publicado!");
        }

        resetProductForm();
      };

      const resetProductForm = () => {
        setEditingProduct(null);
        setProdName('');
        setProdDesc('');
        setProdPrice('');
        setProdImage('');
      };

      const handleEditProduct = (p) => {
        setEditingProduct(p);
        setProdName(p.name);
        setProdDesc(p.description);
        setProdPrice(p.price.toString());
        setProdCategory(p.category);
        setProdImage(p.image);
      };

      const toggleProductStatus = (id) => {
        setProducts(prev => prev.map(p => p.id === id ? { ...p, active: !p.active } : p));
        showToast("Status alterado!");
      };

      const deleteProduct = (id) => {
        if (confirm("Tem certeza que deseja excluir este produto?")) {
          setProducts(prev => prev.filter(p => p.id !== id));
          showToast("Produto excluído!");
        }
      };

      const handleAddCategory = () => {
        if (newCategoryInput.trim() && !categories.includes(newCategoryInput.trim())) {
          setCategories(prev => [...prev, newCategoryInput.trim()]);
          setProdCategory(newCategoryInput.trim());
          setNewCategoryInput('');
          showToast("Nova categoria criada!");
        }
      };

      if (!isLoggedIn) {
        return (
          <div className="p-6 max-w-sm mx-auto my-8 bg-white border border-slate-200 rounded-3xl shadow-lg">
            <div className="text-center mb-6">
              <div className="w-12 h-12 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto mb-2 text-xl">
                <i className="fas fa-lock"></i>
              </div>
              <h2 className="text-xl font-bold font-title text-slate-800">Painel do Administrador</h2>
              <p className="text-xs text-slate-500 mt-1">Digite suas credenciais para gerenciar a loja</p>
            </div>

            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">E-mail</label>
                <input
                  type="email"
                  value={loginEmail}
                  onChange={e => setLoginEmail(e.target.value)}
                  className="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none"
                  required
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">Senha</label>
                <input
                  type="password"
                  value={loginPassword}
                  onChange={e => setLoginPassword(e.target.value)}
                  className="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none"
                  required
                />
              </div>

              <button
                type="submit"
                className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition text-sm shadow-md"
              >
                Acessar Painel
              </button>
            </form>
            
            <div className="mt-4 p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800">
              <p className="font-bold">Acesso Padrão:</p>
              <p>E-mail: <code>admin@loja.com</code></p>
              <p>Senha: <code>123456</code></p>
            </div>
          </div>
        );
      }

      return (
        <div className="p-4 md:p-6 bg-slate-50 min-h-screen">
          
          {/* Header Admin */}
          <div className="flex items-center justify-between mb-6 pb-4 border-b border-slate-200">
            <div>
              <h2 className="text-xl font-bold font-title text-slate-900">Gerenciador da Loja</h2>
              <p className="text-xs text-slate-500">Altere produtos, loja e acompanhe pedidos</p>
            </div>
            <button
              onClick={() => setIsLoggedIn(false)}
              className="text-xs font-semibold text-red-600 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg border border-red-200"
            >
              Sair
            </button>
          </div>

          {/* NAVEGAÇÃO DE ABAS */}
          <div className="flex space-x-2 border-b border-slate-200 mb-6 overflow-x-auto hide-scrollbar">
            <button
              onClick={() => setActiveTab('products')}
              className={`pb-3 text-xs font-bold whitespace-nowrap px-3 border-b-2 transition ${
                activeTab === 'products' ? 'border-orange-600 text-orange-600' : 'border-transparent text-slate-500'
              }`}
            >
              <i className="fas fa-box mr-1.5"></i> Produtos ({products.length})
            </button>
            <button
              onClick={() => setActiveTab('orders')}
              className={`pb-3 text-xs font-bold whitespace-nowrap px-3 border-b-2 transition ${
                activeTab === 'orders' ? 'border-orange-600 text-orange-600' : 'border-transparent text-slate-500'
              }`}
            >
              <i className="fas fa-list-alt mr-1.5"></i> Pedidos ({orders.length})
            </button>
            <button
              onClick={() => setActiveTab('settings')}
              className={`pb-3 text-xs font-bold whitespace-nowrap px-3 border-b-2 transition ${
                activeTab === 'settings' ? 'border-orange-600 text-orange-600' : 'border-transparent text-slate-500'
              }`}
            >
              <i className="fas fa-cog mr-1.5"></i> Configurações da Loja
            </button>
          </div>

          {/* ABA PRODUTOS */}
          {activeTab === 'products' && (
            <div className="space-y-6">
              
              {/* FORMULÁRIO DE CADASTRO / EDIÇÃO */}
              <div className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
                <h3 className="font-bold text-sm text-slate-800 mb-4 flex items-center justify-between">
                  <span>{editingProduct ? 'Editar Produto' : 'Cadastrar Novo Produto'}</span>
                  {editingProduct && (
                    <button onClick={resetProductForm} className="text-xs text-slate-400 hover:text-slate-600">
                      Cancelar Edição
                    </button>
                  )}
                </h3>

                <form onSubmit={handleSaveProduct} className="space-y-4">
                  
                  {/* Foto Upload */}
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Foto do Produto</label>
                    <div className="flex items-center space-x-4">
                      {prodImage ? (
                        <img src={prodImage} alt="Preview" className="w-16 h-16 rounded-xl object-cover border" />
                      ) : (
                        <div className="w-16 h-16 bg-slate-100 rounded-xl flex items-center justify-center text-slate-400 text-xl border border-dashed border-slate-300">
                          <i className="fas fa-image"></i>
                        </div>
                      )}
                      <input
                        type="file"
                        accept="image/*"
                        onChange={handleImageUpload}
                        className="text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-orange-50 file:text-orange-600 hover:file:bg-orange-100"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Nome do Produto *</label>
                    <input
                      type="text"
                      required
                      value={prodName}
                      onChange={e => setProdName(e.target.value)}
                      placeholder="Ex: X-Salada Especial"
                      className="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Descrição</label>
                    <textarea
                      value={prodDesc}
                      onChange={e => setProdDesc(e.target.value)}
                      placeholder="Ingredientes e detalhes..."
                      className="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none"
                      rows="2"
                    ></textarea>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Preço (R$) *</label>
                      <input
                        type="number"
                        step="0.01"
                        required
                        value={prodPrice}
                        onChange={e => setProdPrice(e.target.value)}
                        placeholder="25.00"
                        className="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Categoria</label>
                      <select
                        value={prodCategory}
                        onChange={e => setProdCategory(e.target.value)}
                        className="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none"
                      >
                        {categories.map(c => (
                          <option key={c} value={c}>{c}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  {/* Criar Categoria rápida */}
                  <div className="pt-2 border-t border-slate-100 flex items-center space-x-2">
                    <input
                      type="text"
                      value={newCategoryInput}
                      onChange={e => setNewCategoryInput(e.target.value)}
                      placeholder="Criar nova categoria..."
                      className="flex-1 text-xs border border-slate-200 rounded-xl p-2 focus:outline-none"
                    />
                    <button
                      type="button"
                      onClick={handleAddCategory}
                      className="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs px-3 py-2 rounded-xl font-bold"
                    >
                      + Criar
                    </button>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-xl shadow-md text-sm transition"
                  >
                    {editingProduct ? 'PUBLICAR ALTERAÇÕES' : 'PUBLICAR PRODUTO'}
                  </button>

                </form>
              </div>

              {/* LISTA DE PRODUTOS CADASTRADOS */}
              <div className="space-y-3">
                <h3 className="font-bold text-sm text-slate-800">Produtos Cadastrados ({products.length})</h3>
                {products.map(p => (
                  <div key={p.id} className="bg-white p-3 rounded-2xl border border-slate-200 flex items-center justify-between shadow-sm">
                    <div className="flex items-center space-x-3">
                      <img src={p.image} alt={p.name} className="w-12 h-12 rounded-lg object-cover" />
                      <div>
                        <h4 className="font-bold text-xs text-slate-800">{p.name}</h4>
                        <p className="text-xs text-orange-600 font-bold">R$ {p.price.toFixed(2)}</p>
                        <span className="text-[10px] text-slate-400">{p.category}</span>
                      </div>
                    </div>

                    <div className="flex items-center space-x-2">
                      <button
                        onClick={() => toggleProductStatus(p.id)}
                        className={`text-[10px] font-bold px-2.5 py-1 rounded-full ${
                          p.active ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'
                        }`}
                      >
                        {p.active ? 'Ativo' : 'Inativo'}
                      </button>

                      <button
                        onClick={() => handleEditProduct(p)}
                        className="w-8 h-8 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center text-xs"
                      >
                        <i className="fas fa-edit"></i>
                      </button>

                      <button
                        onClick={() => deleteProduct(p.id)}
                        className="w-8 h-8 rounded-lg bg-red-50 text-red-600 flex items-center justify-center text-xs"
                      >
                        <i className="fas fa-trash"></i>
                      </button>
                    </div>
                  </div>
                ))}
              </div>

            </div>
          )}

          {/* ABA PEDIDOS */}
          {activeTab === 'orders' && (
            <div className="space-y-4">
              <h3 className="font-bold text-sm text-slate-800">Histórico de Pedidos Recebidos</h3>
              {orders.length === 0 ? (
                <div className="text-center py-12 text-slate-400 bg-white rounded-2xl p-6 border border-slate-200">
                  <i className="fas fa-receipt text-3xl mb-2 text-slate-300"></i>
                  <p className="text-xs font-medium">Nenhum pedido recebido ainda nesta sessão.</p>
                </div>
              ) : (
                orders.map(o => (
                  <div key={o.id} className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                    <div className="flex items-center justify-between border-b pb-2">
                      <div>
                        <span className="font-bold text-sm text-slate-800">{o.id}</span>
                        <p className="text-[10px] text-slate-400">{new Date(o.createdAt).toLocaleString('pt-BR')}</p>
                      </div>
                      <span className="text-xs bg-orange-100 text-orange-700 font-bold px-2.5 py-1 rounded-full">
                        {o.status}
                      </span>
                    </div>

                    <div className="text-xs space-y-1 text-slate-600">
                      <p><strong>Cliente:</strong> {o.customerName} ({o.phone})</p>
                      <p><strong>Endereço:</strong> {o.address}</p>
                      <p><strong>Pagamento:</strong> {o.paymentMethod} {o.changeFor ? `(Troco para R$ ${o.changeFor})` : ''}</p>
                    </div>

                    <div className="bg-slate-50 p-2 rounded-xl text-xs space-y-1">
                      {o.items.map((it, i) => (
                        <div key={i} className="flex justify-between text-slate-700">
                          <span>{it.quantity}x {it.name}</span>
                          <span>R$ {(it.price * it.quantity).toFixed(2)}</span>
                        </div>
                      ))}
                    </div>

                    <div className="flex items-center justify-between pt-1 text-xs">
                      <span className="font-bold text-slate-800">Total com taxa:</span>
                      <span className="font-extrabold text-orange-600 text-sm">R$ {o.total.toFixed(2)}</span>
                    </div>
                  </div>
                ))
              )}
            </div>
          )}

          {/* ABA CONFIGURAÇÕES DA LOJA */}
          {activeTab === 'settings' && (
            <div className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
              <h3 className="font-bold text-sm text-slate-800 mb-2">Dados da Estabelecimento</h3>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Nome da Loja</label>
                <input
                  type="text"
                  value={store.name}
                  onChange={e => setStore({ ...store, name: e.target.value })}
                  className="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">WhatsApp (com DDD ex: 5511999999999)</label>
                <input
                  type="text"
                  value={store.whatsapp}
                  onChange={e => setStore({ ...store, whatsapp: e.target.value })}
                  className="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Endereço Completo</label>
                <input
                  type="text"
                  value={store.address}
                  onChange={e => setStore({ ...store, address: e.target.value })}
                  className="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Taxa de Entrega (R$)</label>
                  <input
                    type="number"
                    step="0.01"
                    value={store.deliveryFee}
                    onChange={e => setStore({ ...store, deliveryFee: parseFloat(e.target.value) || 0 })}
                    className="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Status do Estabelecimento</label>
                  <button
                    type="button"
                    onClick={() => setStore({ ...store, isOpen: !store.isOpen })}
                    className={`w-full py-2.5 rounded-xl font-bold text-xs transition ${
                      store.isOpen ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'
                    }`}
                  >
                    {store.isOpen ? 'ABERTO' : 'FECHADO'}
                  </button>
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">URL Imagem de Banner</label>
                <input
                  type="text"
                  value={store.bannerUrl}
                  onChange={e => setStore({ ...store, bannerUrl: e.target.value })}
                  className="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none"
                />
              </div>

              <button
                onClick={() => showToast("Configurações da loja salvas!")}
                className="w-full bg-slate-900 text-white font-bold py-3 rounded-xl shadow-md text-sm transition mt-4"
              >
                Salvar Configurações
              </button>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
